server:
  port: 0 # Porta aleatoria
security:
  jwt:
    token:
      secret-key: "segredo-super-seguro-para-testes-de-integracao-petajuda"
      expire-length: 3600000
cors:
  allowed-origins: "allowed_origin"
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true
flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
cloudinary:
  cloud-name: "test-cloud-name"
  api-key: "123456789012345"
  api-secret: "test-api-secret"
logging:
  level:
    root: WARN
    com.petajuda: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO